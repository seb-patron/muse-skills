storage:
  committed_here: digests, timestamps, provenance, and the extraction query only
  text_location: a local directory outside this repository
  environment_variable: GENV_PR87_SNAPSHOT_DIR
  default_directory: ~/.local/share/muse-skills/genv-pr87-snapshots
  verification: >-
    Every file is checked against both its stored and its delivered (trimmed) digest
    before delivery. A missing directory or any digest mismatch fails loudly and no
    unverified text is ever delivered.
extraction_command: >-
  gh api graphql -F owner=seb-patron -F name=gen-v-research-tools -F number=87
  -F query=@query.graphql
extraction_query: |
  query($owner: String!, $name: String!, $number: Int!) {
    repository(owner: $owner, name: $name) {
      pullRequest(number: $number) {
        number
        title
        createdAt
        lastEditedAt
        mergedAt
        baseRefOid
        headRefOid
        body
        userContentEdits(first: 100) {
          totalCount
          pageInfo { hasNextPage endCursor }
          nodes { id createdAt editedAt updatedAt deletedAt editor { login } diff }
        }
      }
    }
  }
extraction_result:
  user_content_edits_total: 5
  has_next_page: false
  live_body_equals_stage: d
  editor: seb-patron
sanitization:
  applied_to: every snapshot, before hashing
  rules:
    - id: commercial-title
      description: >-
        The commercial title token is replaced with a fixed placeholder. The token itself
        is not recorded here, because naming it would republish the identity the gen-v
        repository forbids in pull requests.
      replacement: "[redacted-commercial-title]"
    - id: truncated-input-digest
      description: >-
        Truncated ROM, save, adapter, and emulator digests are replaced with a fixed
        placeholder; they identify private inputs.
      replacement: "`[redacted-input-digest]`"
  replacements_per_snapshot: 5
  normalization:
    - id: trailing-blank-line
      description: >-
        Stored snapshots end with exactly one newline. Only trailing blank lines at end
        of file are affected, so the delivered (trimmed) text is byte-identical to the
        sanitized export.
  unchanged_otherwise: true
  proof: >-
    Digest equality against delivered_sha256 is what proves a delivered body is exactly
    the sanitized export, since the redaction rules were applied before hashing.
