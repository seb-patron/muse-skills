# Frozen PR-body snapshots for the Gen V PR #87 repair chain: digests and provenance only.
#
# gen-v-research-tools is private and this repository is public, so no snapshot text is
# committed here. Only SHA-256 digests, timestamps, and the extraction query live in Git.
# The sanitized text is held in a local directory outside the repository and is verified
# against these digests before it is delivered to a candidate; see snapshot_var.py and
# DEVELOPMENT_V4.md.
