    unadjudicated_observation: >-
      The stage-A body reports 2884 insertions and a 66-line reading-trail entry while
      `git diff --shortstat` for this head reports 2888 insertions and 68 lines. This
      possible extra finding is deliberately excluded from gold until a human
      adjudicates it.
  vars:
    source_repository: gen-v-research-tools
