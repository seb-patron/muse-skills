    base_tree_sha: f09830fc326462a0916142c84671094be4c0cfa9
    head_sha: 122108e791e5d856200cfcde6e20a4998194b117
    head_tree_sha: ac68ddc1e1b296969b912751b7f37892ec02cb5a
    skill_name: adversarial-review
    expected_verdict: NEEDS_FIXES
    pr_body_stage: a
    pr_title_snapshot: file://fixtures/genv-pr87/snapshot_var.py
    pr_body_snapshot: file://fixtures/genv-pr87/snapshot_var.py
    change_summary: >-
      Adds a bounded shifted-press research probe, runner, fixture assembler, hash-only
      durable fixture, research note, reading-trail entry, and synthetic validation from
      an owner-authorized bounded evidence run. The assembler validates a nested runner
      summary before publishing the durable fixture.
    gold_findings: |
      1. path-free-allowlist-bypass (blocking): The assembler reads the runner summary
         with a direct byte read instead of the bounded no-follow loader, and emits
         caller-supplied fixture identity, issue, repeatability method, and the whole
         repeatability mapping without exact shape validation. A symlinked input and
         path-bearing caller values are therefore accepted and published into the
         durable fixture.
      2. repeatability-not-independently-bound (blocking): The runner collapses both
         repetitions of an arm into one retained result and the assembler only tests the
         repeatability receipt for truthiness, so a truthy non-boolean receipt still
         yields a fixture asserting twice-deterministic evidence that the durable
         artifact cannot establish.
      3. missing-framebuffer-pre-intervention-control (blocking): Pre-intervention
         equality compares RAM digests only, so an arm whose framebuffer already differs
         from control before the scheduled press is still accepted and its later
         divergence is published as observed manipulation evidence.
      4. classifier-prose-mismatch (should-fix): A quadrant whose common contrast offset
         sets match classifies as timing-shift-supported even when one arm carries an
         additional unmatched later contrast, contradicting the documented
         state-dependent/unresolved rule in the research note.
    resolved_findings: |
      NONE. This is the initial defect-bearing head of the chain; no earlier finding
      exists that could be wrongly resurrected here.

