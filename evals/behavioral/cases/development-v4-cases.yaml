    reproduction: >-
      All four findings were reproduced independently on this frozen head with
      synthetic inputs only, no emulator invocation and no commercial input, by
      `PYTHONPATH=src python3 probe_stage.py` (exit 0): a symlinked synthetic summary
      with path-bearing caller identity was accepted and re-emitted; truthy string
      repeatability receipts were accepted and re-emitted; a synthetic arm whose
      framebuffer differed from control at the first checkpoint still exited 0 with
      validity accepted and pre_intervention_equality pass; and a quadrant with equal
