- description: "[development] Gen V PR #87 first repair exact-boundary case"
  metadata:
    case_id: genv-pr87-first-repair-type-boundary
    family: genv-pr87
    split: development
    data_role: development
    gold_status: independently-reproduced-development
    human_adjudication: false
