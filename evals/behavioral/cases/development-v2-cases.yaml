    source: https://github.com/seb-patron/gen-v-research-tools/pull/87
    review_provenance: https://github.com/seb-patron/gen-v-research-tools/pull/87#issuecomment-5658445369
    reproduction: >-
      At the frozen head, an independently constructed synthetic summary changed
      execution.frames from integer 3600 to float 3600.0; assemble() accepted it
      and emitted `float 3600.0`. No commercial input or emulator run was used.
  vars:
    source_repository: gen-v-research-tools
    base_sha: b5eb2e15da936b33f9d6703b2a347777affe1c05
    base_tree_sha: f09830fc326462a0916142c84671094be4c0cfa9
    head_sha: 8850ee389109d22bd2ce7b4d3a23ae50ff3c1ddc
    head_tree_sha: 0550846f60851b5033a4d48ad109fc6bb19b2c35
    skill_name: adversarial-review
    expected_verdict: NEEDS_FIXES
    change_summary: >-
      Adds a bounded shifted-press research probe, runner, fixture assembler,
      hash-only durable fixture, research note, and synthetic validation. The
      assembler validates a nested runner summary before publishing a fixture.
    gold_findings: |
      1. nested-numeric-type-alias (blocking): The assembler compares trusted
         nested structures with ordinary Python equality and then emits caller-shaped
         values. Equal-valued numeric aliases such as execution.frames=3600.0 in
         place of integer 3600 are accepted, so the claimed exact structured boundary
         is false and untrusted scalar types can enter the durable fixture.
    resolved_findings: |
      Earlier path-loader/privacy, framebuffer-precondition, and unmatched-contrast
      findings are repaired at this head and must not be reported as still present.

