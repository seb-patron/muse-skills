# Baseline evals for muse-skills review-loop skills.
#
# Offline and deterministic: custom Python providers return repo file content
# (no model calls, no network, no API keys), and assertions pin the skill
# surface that must survive future edits. Any removed probe row, verdict rule,
# or traceability step goes red.
#
# Run:   npm run eval:baseline
#        (or: npx promptfoo eval)
# Config is auto-discovered as promptfooconfig.yaml at the repo root.

description: muse-skills baseline evals (offline, deterministic)

prompts:
  - file://evals/prompts/skill_surface.txt

providers:
  - file://evals/providers/skill_provider.py

tests:
  # --- adversarial-review: identity + trigger ---
  - description: adversarial-review frontmatter and trigger section
    vars:
      skill: adversarial-review
    assert:
      - type: contains
        value: 'name: adversarial-review'
      - type: contains
        value: 'description: Run a pre-verdict adversarial probe pass'
      - type: contains
        value: '# Adversarial Review'
      - type: contains
        value: '## Trigger'
      - type: contains
        value: 'git rev-parse HEAD'
      - type: javascript
        value: 'output.length > 2000'

  # --- adversarial-review: probe catalogue rows ---
  - description: adversarial-review probe catalogue rows
    vars:
      skill: adversarial-review
    assert:
      - type: contains
        value: '## Probe catalogue'
      - type: contains
        value: 'Isolated-import probe'
      - type: contains
        value: 'Revert-probe new tests'
      - type: contains
        value: 'Linked-worktree'
      - type: contains
        value: 'Non-UTF8 and FIFO'
      - type: contains
        value: 'Env-strip'
      - type: contains
        value: 'Alias-form guard evasions'
      - type: contains
        value: 'Moved-code coverage'
      - type: contains
        value: 'Lone-file vendor'
      - type: contains
        value: 'Workspace-copy execution'
      - type: contains
        value: 'Dirty / sdist / foreign-HEAD builds'
      - type: contains
        value: 'Prog-name-un-normalized diff'
      - type: contains
        value: 'Exit-status-discarding mutants'
      - type: contains
        value: 'Verbatim-doc run'
      - type: contains
        value: 'Digest-mutation check'

  # --- adversarial-review: refutation + verdict ---
  - description: adversarial-review refutation pass and verdict rules
    vars:
      skill: adversarial-review
    assert:
      - type: contains
        value: '## Refutation pass'
      - type: contains
        value: '## Verdict rules'
      - type: contains
        value: 'Revision rounds: 0/3'
      - type: contains
        value: 'never treat a green suite'

  # --- fix-verification: identity + trigger ---
  - description: fix-verification frontmatter and trigger section
    vars:
      skill: fix-verification
    assert:
      - type: contains
        value: 'name: fix-verification'
      - type: contains
        value: 'description: Verify a fix batch'
      - type: contains
        value: '# Fix Verification'
      - type: contains
        value: '## Trigger'
      - type: contains
        value: 'git rev-parse HEAD'
      - type: javascript
        value: 'output.length > 2000'

  # --- fix-verification: closeout steps ---
  - description: fix-verification traceability and closeout steps
    vars:
      skill: fix-verification
    assert:
      - type: contains
        value: 'Build the traceability table'
      - type: contains
        value: 'Diff-to-row mapping'
      - type: contains
        value: 'Re-run each repro on the final head'
      - type: contains
        value: 'Rebase and stack re-verification'
      - type: contains
        value: 'Status-field consistency'
      - type: contains
        value: 'Update the revision counter'
      - type: contains
        value: 'Revision rounds: N/3'
      - type: contains
        value: 'Close or carry'
      - type: contains
        value: 'never silently park a row'

  # --- repo layout: exactly one SKILL.md per skill directory ---
  - description: skills layout is exactly one SKILL.md per skill
    vars:
      skill: adversarial-review
    provider: file://evals/providers/layout_provider.py
    assert:
      - type: contains
        value: 'skills/adversarial-review/SKILL.md'
      - type: contains
        value: 'skills/fix-verification/SKILL.md'
      - type: javascript
        value: 'output.trim().split(''\n'').length === 3'
